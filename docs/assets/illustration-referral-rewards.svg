<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b111e"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="r-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8ff00"/>
      <stop offset="1" stop-color="#7fe80a"/>
    </linearGradient>
    <linearGradient id="r-violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="r-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c2e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0d1320" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="r-glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8ff00" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r-glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="r-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="620" fill="url(#r-bg)"/>
  <g stroke="#1a2338" stroke-width="1">
    <path d="M0 103 H1600 M0 206 H1600 M0 309 H1600 M0 412 H1600 M0 515 H1600"/>
    <path d="M100 0 V620 M220 0 V620 M340 0 V620 M460 0 V620 M580 0 V620 M700 0 V620 M820 0 V620 M940 0 V620 M1060 0 V620 M1180 0 V620 M1300 0 V620 M1420 0 V620 M1540 0 V620"/>
  </g>
  <circle cx="1230" cy="170" r="360" fill="url(#r-glowViolet)"/>
  <circle cx="420" cy="470" r="380" fill="url(#r-glowLime)"/>

  <!-- ══ Title ══ -->
  <g>
    <rect x="70" y="62" width="64" height="6" rx="3" fill="url(#r-lime)"/>
    <text x="70" y="132" fill="#ffffff" font-size="52" font-weight="800">Referral Rewards, <tspan fill="#c8ff00">Paid Automatically</tspan></text>
    <text x="72" y="172" fill="#9aa4b8" font-size="21">One idempotent payout path &#183; shared by the automatic trigger and the admin tools</text>
  </g>

  <!-- ══ Step 1 — referrer shares the link ══ -->
  <g transform="translate(96 244)">
    <g filter="url(#r-soft)" opacity="0.5"><rect x="12" y="16" width="300" height="260" rx="18" fill="#000" opacity="0.55"/></g>
    <rect x="0" y="0" width="300" height="260" rx="18" fill="url(#r-card)" stroke="#26334d"/>

    <!-- person -->
    <circle cx="74" cy="74" r="24" fill="#1b2740" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M40 146 C40 116 56 102 74 102 C92 102 108 116 108 146 Z" fill="#1b2740" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- link card -->
    <rect x="146" y="46" width="126" height="52" rx="12" fill="#0a1120" stroke="#3b82f6"/>
    <g stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M190 72 h20 a9 9 0 0 0 0-18 h-12"/>
      <path d="M228 72 h-20 a9 9 0 0 1 0-18 h12"/>
    </g>

    <text x="24" y="188" fill="#ffffff" font-size="15" font-weight="700">1 &#183; Share the referral link</text>
    <text x="24" y="212" fill="#5b647a" font-size="12.5">The new account is linked on sign-up.</text>
    <g>
      <rect x="24" y="224" width="118" height="24" rx="12" fill="#101828" stroke="#26334d"/>
      <text x="83" y="240" fill="#9aa4b8" font-size="11" font-weight="600" text-anchor="middle">status: pending</text>
    </g>
  </g>

  <!-- ══ Step 2 — payment verified ══ -->
  <g transform="translate(500 244)">
    <g filter="url(#r-soft)" opacity="0.5"><rect x="12" y="16" width="300" height="260" rx="18" fill="#000" opacity="0.55"/></g>
    <rect x="0" y="0" width="300" height="260" rx="18" fill="url(#r-card)" stroke="#26334d"/>

    <!-- credit card -->
    <rect x="30" y="34" width="150" height="92" rx="12" fill="#16203a" stroke="#3a4560"/>
    <rect x="30" y="52" width="150" height="14" fill="#0f1830"/>
    <rect x="44" y="80" width="44" height="8" rx="4" fill="#3a4560"/>
    <circle cx="150" cy="92" r="11" fill="#f59e0b" opacity="0.75"/>
    <circle cx="162" cy="92" r="11" fill="#ef4444" opacity="0.55"/>

    <!-- check badge -->
    <circle cx="222" cy="80" r="30" fill="#c8ff00" opacity="0.15"/>
    <circle cx="222" cy="80" r="21" fill="#132033" stroke="#c8ff00" stroke-width="2.5"/>
    <path d="M212 80 l7 8 l14 -16" fill="none" stroke="#c8ff00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="188" fill="#ffffff" font-size="15" font-weight="700">2 &#183; First payment verified</text>
    <text x="24" y="212" fill="#5b647a" font-size="12.5">Callback, admin button or webhook &#8212; one path.</text>
    <g>
      <rect x="24" y="224" width="140" height="24" rx="12" fill="#101828" stroke="#26334d"/>
      <text x="94" y="240" fill="#3b82f6" font-size="11" font-weight="600" text-anchor="middle">completeTransaction()</text>
    </g>
  </g>

  <!-- ══ Step 3 — rewards paid ══ -->
  <g transform="translate(904 244)">
    <g filter="url(#r-soft)" opacity="0.5"><rect x="12" y="16" width="300" height="260" rx="18" fill="#000" opacity="0.55"/></g>
    <rect x="0" y="0" width="300" height="260" rx="18" fill="url(#r-card)" stroke="#26334d"/>

    <!-- reward hub -->
    <circle cx="88" cy="82" r="48" fill="#c8ff00" opacity="0.14"/>
    <circle cx="88" cy="82" r="34" fill="#132033" stroke="url(#r-lime)" stroke-width="2.5"/>
    <path d="M74 82 l10 10 l20 -22" fill="none" stroke="#c8ff00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- coins -->
    <g fill="#c8ff00">
      <ellipse cx="176" cy="52" rx="15" ry="5" opacity="0.85"/>
      <path d="M161 52 v12 a15 5 0 0 0 30 0 v-12" fill="#9fd000" opacity="0.6"/>
      <ellipse cx="196" cy="96" rx="11" ry="4" opacity="0.7"/>
      <path d="M185 96 v9 a11 4 0 0 0 22 0 v-9" fill="#7fe80a" opacity="0.5"/>
    </g>

    <!-- recipients -->
    <circle cx="238" cy="62" r="15" fill="#1b2740" stroke="#a855f7" stroke-width="2.2"/>
    <path d="M217 108 C217 90 226 82 238 82 C250 82 259 90 259 108 Z" fill="#1b2740" stroke="#a855f7" stroke-width="2.2"/>
    <circle cx="238" cy="120" r="13" fill="#132033" stroke="#c8ff00" stroke-width="2"/>
    <path d="M231 120 l5 6 l10 -12" fill="none" stroke="#c8ff00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="188" fill="#ffffff" font-size="15" font-weight="700">3 &#183; Both sides rewarded</text>
    <text x="24" y="212" fill="#5b647a" font-size="12.5">Referrer reward + welcome bonus, ledgered.</text>
    <g>
      <rect x="24" y="224" width="122" height="24" rx="12" fill="#101828" stroke="#26334d"/>
      <text x="85" y="240" fill="#c8ff00" font-size="11" font-weight="600" text-anchor="middle">status: rewarded</text>
    </g>
  </g>

  <!-- ══ Arrows between the steps ══ -->
  <g stroke="url(#r-lime)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M412 374 H 488"/>
    <path d="M816 374 H 892"/>
  </g>
  <g fill="#c8ff00" opacity="0.75">
    <path d="M484 366 L496 374 L484 382 Z"/>
    <path d="M888 366 L900 374 L888 382 Z"/>
  </g>

  <!-- ══ Admin strip ══ -->
  <g transform="translate(1220 244)">
    <g filter="url(#r-soft)" opacity="0.5"><rect x="12" y="16" width="276" height="260" rx="18" fill="#000" opacity="0.55"/></g>
    <rect x="0" y="0" width="276" height="260" rx="18" fill="#0e1626" stroke="#a855f7" stroke-opacity="0.55"/>
    <circle cx="34" cy="34" r="13" fill="#a855f7" opacity="0.25"/>
    <path d="M27 35 a7 7 0 0 1 14 0 v5 h2 v12 h-18 v-12 h2 Z" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="58" y="39" fill="#ffffff" font-size="16" font-weight="700">Admin control</text>

    <g font-size="12.5" font-weight="600">
      <rect x="22" y="66" width="232" height="30" rx="8" fill="#101828" stroke="#26334d"/>
      <circle cx="40" cy="81" r="5" fill="#c8ff00"/>
      <text x="54" y="85" fill="#dbe3f0">Pay reward</text>

      <rect x="22" y="104" width="232" height="30" rx="8" fill="#101828" stroke="#26334d"/>
      <circle cx="40" cy="119" r="5" fill="#3b82f6"/>
      <text x="54" y="123" fill="#dbe3f0">Pay all pending</text>

      <rect x="22" y="142" width="232" height="30" rx="8" fill="#101828" stroke="#26334d"/>
      <circle cx="40" cy="157" r="5" fill="#f59e0b"/>
      <text x="54" y="161" fill="#dbe3f0">Reset to pending</text>

      <rect x="22" y="180" width="232" height="30" rx="8" fill="#101828" stroke="#26334d"/>
      <circle cx="40" cy="195" r="5" fill="#ef4444"/>
      <text x="54" y="199" fill="#dbe3f0">Reject</text>
    </g>

    <rect x="22" y="222" width="232" height="22" rx="11" fill="#1a1430" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="138" y="237" fill="#c4b5fd" font-size="10.5" font-weight="700" text-anchor="middle">TUNABLE REWARD AMOUNTS</text>
  </g>

  <!-- ══ Bottom strip ══ -->
  <g transform="translate(96 566)" font-size="13" font-weight="600">
    <rect x="0" y="-24" width="1400" height="52" rx="14" fill="#0e1626" stroke="#223050"/>
    <circle cx="30" cy="2" r="6" fill="#c8ff00"/>
    <text x="46" y="7" fill="#dbe3f0">Idempotent &#8212; the pending &#8594; rewarded flip can only succeed once</text>
    <circle cx="520" cy="2" r="6" fill="#3b82f6"/>
    <text x="536" y="7" fill="#dbe3f0">Manual and automatic payouts share one code path</text>
    <circle cx="946" cy="2" r="6" fill="#a855f7"/>
    <text x="962" y="7" fill="#dbe3f0">Every payout lands in the referral_rewards ledger</text>
  </g>

  <rect x="0" y="608" width="1600" height="12" fill="url(#r-lime)" opacity="0.35"/>
</svg>
