<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b111e"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8ff00"/>
      <stop offset="1" stop-color="#7fe80a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8ff00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c8ff00"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d30"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8ff00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8ff00" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8ff00" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="533" fill="url(#bg)"/>
  <g stroke="#161f33" stroke-width="1">
    <path d="M0 106 H1600 M0 213 H1600 M0 320 H1600 M0 427 H1600"/>
    <path d="M160 0 V533 M320 0 V533 M480 0 V533 M640 0 V533 M800 0 V533 M960 0 V533 M1120 0 V533 M1280 0 V533 M1440 0 V533"/>
  </g>
  <circle cx="1340" cy="110" r="330" fill="url(#glowBlue)"/>
  <circle cx="360" cy="450" r="360" fill="url(#glowLime)"/>

  <!-- ══ Left: logo + wordmark ══ -->
  <g>
    <!-- logo mark -->
    <rect x="70" y="72" width="58" height="58" rx="16" fill="url(#lime)"/>
    <path d="M99 84 L83 106 L96 106 L93 118 L109 96 L96 96 Z" fill="#0b111e"/>
    <text x="148" y="119" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="0.5">Adsbooster<tspan fill="#c8ff00">.net</tspan></text>

    <text x="72" y="168" fill="#9aa4b8" font-size="24" font-weight="400" letter-spacing="0.4">AI Ad Optimization &#183; AI UGC Studios &#183; Multi-Network Publishing</text>

    <!-- feature chips -->
    <g font-size="17" font-weight="600">
      <rect x="70" y="208" width="224" height="44" rx="22" fill="#111a2b" stroke="#253248"/>
      <circle cx="94" cy="230" r="6" fill="#c8ff00"/>
      <text x="110" y="236" fill="#dbe3f0">AI UGC Image Studio</text>

      <rect x="308" y="208" width="240" height="44" rx="22" fill="#111a2b" stroke="#253248"/>
      <circle cx="332" cy="230" r="6" fill="#3b82f6"/>
      <text x="348" y="236" fill="#dbe3f0">AI Video Studio (Veo)</text>

      <rect x="562" y="208" width="238" height="44" rx="22" fill="#111a2b" stroke="#253248"/>
      <circle cx="586" cy="230" r="6" fill="#f59e0b"/>
      <text x="602" y="236" fill="#dbe3f0">Automated Ad Engine</text>
    </g>

    <!-- tech line -->
    <g font-size="16" fill="#5b647a" font-weight="500">
      <text x="72" y="300">Vanilla PHP 8.x</text>
      <circle cx="222" cy="295" r="3" fill="#3a4560"/>
      <text x="238" y="300">MySQL 8</text>
      <circle cx="328" cy="295" r="3" fill="#3a4560"/>
      <text x="344" y="300">Gemini + Groq AI</text>
      <circle cx="508" cy="295" r="3" fill="#3a4560"/>
      <text x="524" y="300">Flutterwave / Paystack</text>
      <circle cx="704" cy="295" r="3" fill="#3a4560"/>
      <text x="720" y="300">Bundle.social API</text>
    </g>

    <!-- key stats -->
    <g>
      <rect x="70" y="346" width="260" height="104" rx="16" fill="#101828" stroke="#223050"/>
      <text x="94" y="398" fill="#c8ff00" font-size="34" font-weight="800">2,980</text>
      <text x="94" y="426" fill="#8a94aa" font-size="15" font-weight="500">AI creatives / month</text>

      <rect x="350" y="346" width="220" height="104" rx="16" fill="#101828" stroke="#223050"/>
      <text x="374" y="398" fill="#ffffff" font-size="34" font-weight="800">7</text>
      <text x="374" y="426" fill="#8a94aa" font-size="15" font-weight="500">ad networks integrated</text>

      <rect x="590" y="346" width="230" height="104" rx="16" fill="#101828" stroke="#223050"/>
      <text x="614" y="398" fill="#3b82f6" font-size="34" font-weight="800">30%</text>
      <text x="614" y="426" fill="#8a94aa" font-size="15" font-weight="500">average yearly saving</text>
    </g>
  </g>

  <!-- ══ Right: dashboard card ══ -->
  <g transform="translate(990 96)">
    <g filter="url(#soft)" opacity="0.55"><rect x="14" y="20" width="480" height="296" rx="20" fill="#000" opacity="0.5"/></g>
    <rect x="0" y="0" width="480" height="296" rx="20" fill="url(#card)" stroke="#26334d"/>
    <circle cx="30" cy="30" r="5" fill="#ef4444"/>
    <circle cx="52" cy="30" r="5" fill="#f59e0b"/>
    <circle cx="74" cy="30" r="5" fill="#c8ff00"/>
    <text x="100" y="36" fill="#5b647a" font-size="15" font-weight="600">Campaign Performance</text>

    <!-- bar chart -->
    <g>
      <rect x="44"  y="192" width="44" height="60" rx="8" fill="#253248"/>
      <rect x="104" y="156" width="44" height="96" rx="8" fill="#253248"/>
      <rect x="164" y="118" width="44" height="134" rx="8" fill="#253248"/>
      <rect x="224" y="86"  width="44" height="166" rx="8" fill="url(#bar)"/>
      <rect x="284" y="58"  width="44" height="194" rx="8" fill="url(#bar)"/>
      <rect x="344" y="36"  width="44" height="216" rx="8" fill="url(#bar)"/>
      <polyline points="66,188 126,152 186,114 246,82 306,54 366,34" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="366" cy="34" r="7" fill="#3b82f6"/>
      <circle cx="366" cy="34" r="13" fill="#3b82f6" opacity="0.25"/>
    </g>

    <!-- KPI pills -->
    <g font-size="16" font-weight="700">
      <rect x="44" y="252" width="128" height="34" rx="17" fill="#101828" stroke="#26334d"/>
      <text x="60" y="274" fill="#c8ff00">CTR 6.8%</text>
      <rect x="184" y="252" width="132" height="34" rx="17" fill="#101828" stroke="#26334d"/>
      <text x="200" y="274" fill="#3b82f6">1.2M Reach</text>
      <rect x="328" y="252" width="108" height="34" rx="17" fill="#101828" stroke="#26334d"/>
      <text x="344" y="274" fill="#9aa4b8">&#8358; NGN</text>
    </g>
  </g>

  <!-- ══ Gateway flow strip (bottom right) ══ -->
  <g transform="translate(990 440)" font-size="15" font-weight="600">
    <rect x="0" y="-24" width="480" height="56" rx="14" fill="#0e1626" stroke="#223050"/>
    <text x="24" y="4" fill="#c8ff00">Bundle.social</text>
    <text x="24" y="22" fill="#5b647a" font-size="12" font-weight="500">Organic Engine</text>
    <line x1="146" y1="4" x2="192" y2="4" stroke="#3a4560" stroke-width="2"/>
    <path d="M186 -3 L198 4 L186 11 Z" fill="#3a4560"/>
    <text x="218" y="4" fill="#3b82f6">Zernio</text>
    <text x="218" y="22" fill="#5b647a" font-size="12" font-weight="500">Ads Engine</text>
    <line x1="306" y1="4" x2="352" y2="4" stroke="#3a4560" stroke-width="2"/>
    <path d="M346 -3 L358 4 L346 11 Z" fill="#3a4560"/>
    <text x="378" y="4" fill="#dbe3f0" font-size="13">7+ Networks</text>
    <text x="378" y="22" fill="#5b647a" font-size="12" font-weight="500">FB &#183; IG &#183; TT &#183; X &#183; LI</text>
  </g>

  <!-- bottom accent edge -->
  <rect x="0" y="529" width="1600" height="4" fill="url(#edge)"/>
</svg>
